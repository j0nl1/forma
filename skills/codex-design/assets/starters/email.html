<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Project update</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f2f4f7;
      font-family: Arial, sans-serif;
      color: #202c39;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden">
      Your project is ready to review.
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="width: 100%; max-width: 600px; background: white"
          >
            <tr>
              <td style="padding: 32px">
                <h1 style="margin: 0 0 20px; font-size: 28px; line-height: 1.2">
                  Ready for your next step
                </h1>
                <p style="font-size: 16px; line-height: 1.6; margin: 0 0 24px">
                  Review the latest changes, share feedback, and decide what to
                  build next.
                </p>
                <a
                  href="https://example.com/review"
                  style="
                    display: inline-block;
                    padding: 14px 22px;
                    background: #275dad;
                    color: white;
                    text-decoration: none;
                    border-radius: 6px;
                    font-weight: bold;
                  "
                  >Review project</a
                >
                <p
                  style="
                    font-size: 12px;
                    line-height: 1.6;
                    color: #5d6673;
                    margin: 28px 0 0;
                  "
                >
                  Replace this example with your real sender details and
                  required footer before sending.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
