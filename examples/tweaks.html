<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Harbor · Design controls</title>
    <script id="codex-tweak-defaults" type="application/json">
      {
        "fontSize": 42,
        "spacing": 24,
        "density": "comfortable",
        "columns": 2,
        "palette": ["#254f49", "#f6f3e9", "#e3a576"],
        "dark": false,
        "title": "Keep what stays with you.",
        "weight": 0.5
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f3e9;
        color: #254f49;
        font: 16px/1.5 system-ui;
      }
      button,
      a {
        font: inherit;
      }
      a {
        color: inherit;
      }
      header {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid currentColor;
        padding: 22px 0;
        font-size: 12px;
        letter-spacing: 0.1em;
      }
      main {
        min-height: 100vh;
        padding: 0 clamp(20px, 6vw, 100px) 70px;
      }
      .intro {
        max-width: 700px;
        padding: 70px 0 40px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        font-family: Georgia, serif;
        line-height: 1.1;
        margin: 16px 0 24px;
        font-weight: 500;
      }
      h2 {
        font:
          500 24px/1.2 Georgia,
          serif;
        margin: 20px 0;
      }
      p {
        max-width: 55ch;
      }
      .library {
        display: grid;
      }
      .book {
        padding: 26px;
        border: 1px solid currentColor;
        border-radius: 12px;
      }
      .cover {
        height: 160px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        font:
          52px Georgia,
          serif;
      }
      .book button {
        border: 1px solid currentColor;
        color: inherit;
        background: none;
        border-radius: 20px;
        padding: 6px 14px;
        cursor: pointer;
      }
      @media (max-width: 650px) {
        .library {
          grid-template-columns: 1fr !important;
        }
        .intro {
          padding-top: 45px;
        }
        h1 {
          max-width: 12ch;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="tweaks.bundle.js"></script>
  </body>
</html>
