<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A continuous motion composition</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
      }
      .title {
        position: absolute;
        left: 90px;
        top: 90px;
        font:
          80px/1.1 Georgia,
          serif;
        letter-spacing: -3px;
        width: 900px;
        color: #202c39;
      }
      .subtitle {
        position: absolute;
        left: 94px;
        top: 300px;
        font-size: 24px;
        color: #68717a;
      }
      .card {
        position: absolute;
        left: 100px;
        top: 400px;
        width: 400px;
        height: 190px;
        padding: 30px;
        border-radius: 10px;
        background: #275dad;
        color: white;
        font-size: 26px;
      }
      .circle {
        position: absolute;
        left: 850px;
        top: 410px;
        width: 140px;
        height: 140px;
        border: 1px solid #a6bba1;
        background: #dce6d7;
        border-radius: 50%;
      }
      .label {
        position: absolute;
        top: 36px;
        left: 94px;
        color: #68717a;
        font:
          14px ui-monospace,
          monospace;
      }
      .final-note {
        position: absolute;
        left: 680px;
        top: 590px;
        font:
          italic 24px Georgia,
          serif;
        color: #202c39;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.CODEX_SCENES =
        '[{"name":"Opening","dur":2,"desc":"The title appears and the circle begins to move."},{"name":"Collect","dur":2,"desc":"A saved idea glides into the composition."},{"name":"Return","dur":2,"desc":"The shared card settles and the closing caption appears."}]';
      window.CODEX_PLAYBACK = '{"mode":"times","count":1}';
    </script>
    <script src="animation.bundle.js"></script>
  </body>
</html>
