<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A moment in watercolor</title>
    <style>
      html[data-capture] #save-painting,
      body:has(.cd-motion[data-capture]) #save-painting {
        display: none;
      }
    </style>
  </head>
  <body style="margin: 0; background: #0a0a0a">
    <div id="root"></div>
    <button
      id="save-painting"
      style="
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 10;
        padding: 9px 14px;
        background: #fff;
        border: 1px solid #ccc3b5;
        border-radius: 6px;
        cursor: pointer;
      "
    >
      Download PNG
    </button>
    <script>
      window.CODEX_SCENES =
        '[{"name":"Paint","dur":6,"desc":"Pigment, lifted paper and brushstrokes build the bird."},{"name":"Hold","dur":2,"desc":"The finished painting remains visible."}]';
      window.CODEX_PLAYBACK = '{"mode":"times","count":1}';
    </script>
    <script src="watercolor.bundle.js"></script>
  </body>
</html>
