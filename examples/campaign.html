<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="design_doc_mode" content="canvas" />
    <title>Complete social campaign — Studio Design</title>
    <script id="codex-tweak-defaults" type="application/json">
      {
        "instagramPost": true,
        "instagramPortrait": true,
        "story": true,
        "xPost": true,
        "facebook": true,
        "linkedin": true,
        "pinterest": true,
        "reddit": true,
        "youtubeThumbnail": true,
        "tiktok": true,
        "xDesktop": true,
        "linkedinDesktop": true,
        "facebookDesktop": true,
        "redditDesktop": true,
        "imagesOnly": false,
        "carousel": false
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font: 15px/1.6 system-ui;
        color: #263c34;
        margin: 0;
      }
      main {
        width: 2800px;
        padding: 96px 24px 50px;
      }
      header {
        padding: 0 48px;
        max-width: min(1100px, calc(100vw - 48px));
      }
      h1 {
        font: clamp(32px, 4vw, 46px)/1.1 Georgia;
        font-weight: 400;
        margin: 24px 0 18px;
      }
      p {
        max-width: 70em;
      }
      a {
        color: inherit;
      }
      .note {
        font-size: 13px;
      }
      social-frames {
        display: block;
      }
      .campaign-art {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: #fffdf4;
        padding: 10%;
        z-index: 10;
        font-size: 7cqw;
      }
      .campaign-art small {
        font: 400 0.35em/1.3 system-ui;
        letter-spacing: 0.08em;
      }
      .campaign-art h2 {
        font: 400 1em/1.1 Georgia;
        white-space: pre-line;
        margin: 0.8em 0;
      }
      .desktop-feed {
        background: #f3f4ef;
        padding: 36px 76px;
        min-height: 730px;
      }
      chrome-shell[image-only="true"] .desktop-feed {
        padding: 0;
        min-height: 0;
        background: transparent;
      }
      .desktop-asset {
        position: relative;
        width: 100%;
        overflow: hidden;
        container-type: inline-size;
      }
      .desktop-asset > image-slot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .desktop-asset > image-slot::part(status-session) {
        display: none;
      }
      instagram-shell::part(asset),
      instagram-story::part(asset),
      tiktok-shell::part(asset),
      x-shell::part(asset),
      facebook-shell::part(asset),
      linkedin-shell::part(asset),
      pinterest-shell::part(asset),
      reddit-shell::part(asset),
      youtube-shell::part(asset) {
        container-type: inline-size;
      }
      #campaign-result {
        display: block;
        margin: 24px 48px;
        padding: 12px 16px;
        border-left: 3px solid #269d80;
        background: #e3ecdf;
        max-width: min(1000px, calc(100vw - 144px));
      }
      @media (max-width: 480px) {
        main {
          padding-top: 190px;
        }
        header {
          padding: 0;
        }
        #campaign-result {
          margin-inline: 0;
          max-width: calc(100vw - 48px);
        }
      }
    </style>
  </head>
  <body>
    <div id="campaign-app"></div>
    <script
      src="starters/plain-canvas.js"
      data-codex-plain-canvas-runtime
    ></script>
    <script src="campaign.bundle.js"></script>
  </body>
</html>
