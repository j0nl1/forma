<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fixed HTML sheet — Codex Design</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: #e7e8e3;
        color: #233b32;
        font: 14px system-ui;
      }
      nav {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }
      nav a {
        color: inherit;
        margin-right: auto;
      }
      nav button {
        padding: 8px 12px;
        border: 1px solid #9cad9e;
        border-radius: 4px;
        background: #fffdf5;
        color: inherit;
        font: inherit;
      }
      nav label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      main {
        position: relative;
        width: 1200px;
        height: 1600px;
        padding: 96px;
        margin: 0 auto;
        background: #fffdf5;
        overflow: hidden;
      }
      .eyebrow {
        margin: 0;
        font: 28px/1.5 system-ui;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        margin: 130px 0 80px;
        font:
          132px/1.02 Georgia,
          serif;
        font-weight: 400;
        letter-spacing: -0.05em;
      }
      .disc {
        position: absolute;
        right: -160px;
        top: 600px;
        width: 680px;
        height: 680px;
        border-radius: 50%;
        background: #d9b756;
      }
      .arc {
        position: absolute;
        right: 0;
        top: 740px;
        width: 560px;
        height: 560px;
        border: 76px solid #233b32;
        border-radius: 50%;
      }
      .note {
        position: relative;
        margin: 0;
        max-width: 600px;
        font: 32px/1.5 system-ui;
      }
      footer {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 88px;
        display: flex;
        justify-content: space-between;
        gap: 40px;
        border-top: 2px solid #233b32;
        padding-top: 30px;
        font: 24px/1.5 system-ui;
      }
    </style>
  </head>
  <body>
    <nav data-doc-controls aria-label="Fixed sheet preview controls">
      <a href="index.html">← All studies</a>
      <label><input id="actual" type="checkbox" /> Actual-size preview</label>
      <button id="print">Print / Save PDF</button>
    </nav>
    <main>
      <p class="eyebrow">Harbor / Reading room</p>
      <h1>A place<br />for the<br />next idea.</h1>
      <div class="disc" aria-hidden="true"></div>
      <div class="arc" aria-hidden="true"></div>
      <p class="note">
        Save what catches your attention.<br />Return when there is room to
        read.
      </p>
      <footer>
        <span
          >Original illustrative study.<br />No account or publishing
          service.</span
        ><span>1200 × 1600 px<br />One physical PDF page.</span>
      </footer>
    </main>
    <script
      data-codex-fixed-sheet-runtime
      src="starters/fixed-sheet.js"
    ></script>
    <script>
      window.CodexFixedSheetReady.then(() => {
        document.getElementById("actual").onchange = (event) =>
          CodexFixedSheet.setPreview(
            event.target.checked ? "actual-size" : "fit",
          );
        document.getElementById("print").onclick = async () => {
          await CodexFixedSheet.preparePrint();
          try {
            window.print();
          } finally {
            CodexFixedSheet.restorePrint();
          }
        };
      });
    </script>
  </body>
</html>
