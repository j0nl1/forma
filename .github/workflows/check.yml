name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Install export verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils libreoffice-impress python3-uno python3-pil xvfb
      - run: npm run check
      - run: npm test
        env:
          STUDIO_TEST_IMPRESS: '1'
