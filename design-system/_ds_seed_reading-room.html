<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor starting point</title><style>:root {
  --color-paper: #f6f4ee;
  --color-ink: #202c39;
  --color-accent: #275dad;
  --color-on-accent: #ffffff;
  --space-small: 8px;
  --space-medium: 16px;
  --radius-control: 6px; /* @kind radius */
  --font-body: system-ui, sans-serif; /* @kind font */
}
</style><style>
    body {
      margin: 0;
      padding: 40px;
      background: var(--color-paper);
      color: var(--color-ink);
      font: 16px var(--font-body);
    }
    h1 {
      font:
        56px Georgia,
        serif;
      letter-spacing: -2px;
    }
    button {
      background: var(--color-accent);
      color: var(--color-on-accent);
      padding: 12px 20px;
      border: 0;
      border-radius: var(--radius-control);
      font: inherit;
    }
  </style>
  </head><body><h1>Your reading room.</h1>
  <p>A portable starting point using the Harbor tokens.</p>
  <button onclick="this.textContent = 'Collection opened'">
    Open collection
  </button>

</body></html>
